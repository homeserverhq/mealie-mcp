version: 1
repo: mealie-mcp
framework: fastmcp-3

server:
  url_env: MCP_URL
  default_url: "http://localhost:${MCP_SERVER_PORT:-80}/mcp"
  transport: streamable_http_sse
  stateful_env: IS_STATEFUL
  initialize_timeout: 15
  call_timeout: 120

auth:
  type: bearer
  token_env: API_KEY
  token_kind: jwt_user
  token_scope: user
  identity_endpoint: /api/users/self

decode:
  item_fields: [items]
  string_encodings: [toon]
  envelope_keys: [items, page, per_page, total, total_pages]

backend:
  kind: http_api
  base_url_env: MEALIE_BASE_URL
  auth: reuse_token

pagination:
  style: offset
  page_param: page
  size_param: perPage
  max_page_size: 200
  response_keys: [items, page, per_page, total, total_pages]

visibility:
  default_public: true
  private_requires_explicit: true

projection:
  aggregate_flag_env: ALLOW_ALL_AGGREGATE
  parameter: include_all_fields
  single_record_honors: true
  aggregate_honors_when_flag: true

capabilities:
  binary: false
  documents: false
  search: true
  sharing: true
  soft_delete: false
  multi_user: true
  multi_tenant: true
  cursor_pagination: false
  env_gated_projection: true
  external_scraping: false
  smtp: false
  apprise: false
  local_webhooks: true

safety:
  fixture_prefix: "MCPAudit-{run}-"
  allow_destructive: true
  require_owned: true
  slug_resources: [recipe]

tenant:
  enabled_env: AUDIT_TENANT
  group_prefix: "MCPAudit-{run}-group"
  household_prefix: "MCPAudit-{run}-household"
  user_prefix: "mcpaudit_{run}"

domains:
  - schema
  - status
  - recipes
  - organizers
  - comments
  - cookbooks
  - mealplans
  - shopping
  - labels
  - timeline
  - shares
  - actions
  - notifications
  - webhooks
  - invitations
  - user_self
  - group_household
  - admin
  - utilities
  - pagination
  - projection
  - dates
  - errors
  - isolation
  - residue
